<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="code-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.5"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
      }

      .floating-card { animation: float 6s ease-in-out infinite; }
      .cursor-blink { animation: blink 1.1s infinite; }
      .ambient-pulse { animation: pulse 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Background with Border -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <!-- Ambient Glowing Blobs -->
  <circle cx="200" cy="120" r="240" fill="url(#glow-cyan)" class="ambient-pulse"/>
  <circle cx="1020" cy="200" r="280" fill="url(#glow-purple)" class="ambient-pulse" style="animation-delay: -3s;"/>
  <circle cx="620" cy="380" r="200" fill="url(#glow-pink)" class="ambient-pulse" style="animation-delay: -5s;"/>

  <!-- Outer Shiny Border -->
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#card-border)" stroke-width="1.8"/>

  <!-- Top Status Bar in Window -->
  <g transform="translate(60, 48)">
    <!-- Terminal dots -->
    <circle cx="0" cy="0" r="6" fill="#ef4444" opacity="0.9"/>
    <circle cx="20" cy="0" r="6" fill="#f59e0b" opacity="0.9"/>
    <circle cx="40" cy="0" r="6" fill="#10b981" opacity="0.9"/>
    
    <text x="65" y="4" class="font-mono" font-size="12" fill="#64748b" font-weight="500">pooriya@workstation: ~/portfolio</text>

    <!-- Live Status Indicator -->
    <g transform="translate(980, -2)">
      <rect x="-10" y="-10" width="105" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="2" cy="2" r="3.5" fill="#10b981"/>
      <circle cx="2" cy="2" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
      <text x="14" y="6" class="font-sans" font-size="11" fill="#34d399" font-weight="700" letter-spacing="0.5">OPEN TO WORK</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: HERO IDENTITY ================= -->
  <g transform="translate(60, 115)">
    <!-- Role Badge Pill -->
    <g>
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="28" y="18" class="font-sans" font-size="12" fill="#7dd3fc" font-weight="700" letter-spacing="1.2">FULL-STACK ENGINEER</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="78" class="font-sans" font-size="52" font-weight="900" fill="url(#title-grad)" filter="url(#glow-text)" letter-spacing="-0.5">
      POURIYA PARNIYAN
    </text>

    <!-- Subtitle / Motto -->
    <text x="0" y="116" class="font-sans" font-size="20" font-weight="500" fill="#cbd5e1">
      Architecting high-performance software, sleek UI &amp; smart bots
    </text>

    <!-- Tech Tagline / Keywords -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="font-mono" font-size="14" fill="#94a3b8">
        <tspan fill="#38bdf8">&gt;</tspan> C# <tspan fill="#64748b">•</tspan> Python <tspan fill="#64748b">•</tspan> JavaScript <tspan fill="#64748b">•</tspan> PHP <tspan fill="#64748b">•</tspan> MySQL <tspan fill="#64748b">•</tspan> Cloudflare
      </text>
    </g>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 186)">
      <!-- Pill 1: Personality -->
      <g>
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#111827" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
        <text x="14" y="20" class="font-sans" font-size="12" fill="#a5b4fc" font-weight="600">🎯 ENTJ-A Commander</text>
      </g>

      <!-- Pill 2: Studio -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#111827" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" class="font-sans" font-size="12" fill="#f472b6" font-weight="600">🏢 Founder @ Wild Life</text>
      </g>

      <!-- Pill 3: Music & Vibe -->
      <g transform="translate(345, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#111827" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" class="font-sans" font-size="12" fill="#6ee7b7" font-weight="600">🎧 Lo-Fi &amp; Rap Vibes</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE CODE TERMINAL ================= -->
  <g transform="translate(685, 84)" class="floating-card" filter="url(#shadow)">
    <!-- Terminal Background Card -->
    <rect width="455" height="275" rx="16" fill="url(#code-card-bg)"/>
    <rect width="455" height="275" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.2"/>

    <!-- Terminal Header Bar -->
    <rect width="455" height="36" rx="16" fill="#1e293b" fill-opacity="0.5"/>
    <circle cx="24" cy="18" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="18" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="18" r="5" fill="#10b981" opacity="0.8"/>
    <text x="227" y="22" text-anchor="middle" class="font-mono" font-size="11" fill="#94a3b8" font-weight="500">developer.config.ts</text>

    <!-- Code Block Inside Terminal -->
    <g transform="translate(24, 62)" class="font-mono" font-size="12.5" font-weight="500">
      <!-- Line 1 -->
      <text x="0" y="0">
        <tspan fill="#c084fc">const</tspan> <tspan fill="#38bdf8">developer</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#e2e8f0">{</tspan>
      </text>

      <!-- Line 2 -->
      <text x="20" y="24">
        <tspan fill="#e2e8f0">name:</tspan> <tspan fill="#a5f3fc">'Pouriya Parniyan'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 3 -->
      <text x="20" y="48">
        <tspan fill="#e2e8f0">role:</tspan> <tspan fill="#a5f3fc">'Full-Stack &amp; Desktop Dev'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="20" y="72">
        <tspan fill="#e2e8f0">craft:</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#fbcfe8">'Pulse Monitor'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fbcfe8">'UptimePlus'</tspan><tspan fill="#94a3b8">],</tspan>
      </text>

      <!-- Line 5 -->
      <text x="20" y="96">
        <tspan fill="#e2e8f0">stack:</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#fed7aa">'C#'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fed7aa">'Python'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fed7aa">'JS/TS'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fed7aa">'PHP'</tspan><tspan fill="#94a3b8">],</tspan>
      </text>

      <!-- Line 6 -->
      <text x="20" y="120">
        <tspan fill="#e2e8f0">mindset:</tspan> <tspan fill="#6ee7b7">'Excellence over Excuses'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 7 -->
      <text x="20" y="144">
        <tspan fill="#e2e8f0">hireable:</tspan> <tspan fill="#38bdf8">true</tspan>
      </text>

      <!-- Line 8 -->
      <text x="0" y="168">
        <tspan fill="#e2e8f0">};</tspan>
      </text>

      <!-- Line 9 (Prompt) -->
      <text x="0" y="188">
        <tspan fill="#10b981">➜</tspan> <tspan fill="#38bdf8">pooriyayt</tspan> <tspan fill="#f472b6">git:(main)</tspan> <tspan fill="#e2e8f0">pnpm build</tspan><tspan fill="#38bdf8" class="cursor-blink"> ▋</tspan>
      </text>
    </g>

    <!-- Decorative Corner Glow -->
    <circle cx="430" cy="235" r="30" fill="#38bdf8" opacity="0.1" filter="url(#shadow)"/>
  </g>

  <!-- Bottom Accent Line -->
  <g transform="translate(60, 395)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="20" cy="0" r="2" fill="#38bdf8"/>
    <circle cx="540" cy="0" r="2" fill="#818cf8"/>
    <circle cx="1060" cy="0" r="2" fill="#c084fc"/>
  </g>
</svg>
